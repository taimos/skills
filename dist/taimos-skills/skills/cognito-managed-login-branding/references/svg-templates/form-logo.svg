<!--
  Cognito FORM_LOGO template — horizontal lockup (icon + wordmark).
  Cognito-safe: no role/aria attributes, no scripts, viewBox ratio 3.4:1 (within 1:1..4:1).
  Replace the placeholders, then produce LIGHT and DARK variants:
    {{ACCENT}}   brand accent / icon fill        (e.g. #4F46E5)
    {{FG}}       wordmark + icon glyph colour     LIGHT: dark ink (#111827) · DARK: near-white (#F9FAFB)
    {{INITIAL}}  one letter for the icon          (e.g. A)
    {{BRAND}}    the wordmark text                (e.g. Acme)
  Keep the viewBox ratio between 1:1 and 4:1. Widen the viewBox width (not the
  artwork) if a longer wordmark needs more room, or pad height to lower the ratio.
-->
<svg viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="20" width="160" height="160" rx="36" fill="{{ACCENT}}"/>
  <text x="100" y="100" font-family="Arial, Helvetica, sans-serif" font-size="96"
        font-weight="700" fill="{{FG}}" text-anchor="middle" dominant-baseline="central">{{INITIAL}}</text>
  <text x="212" y="100" font-family="Arial, Helvetica, sans-serif" font-size="92"
        font-weight="700" fill="{{FG}}" dominant-baseline="central">{{BRAND}}</text>
</svg>
